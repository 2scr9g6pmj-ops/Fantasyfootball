services:
  - type: web
    name: fantasyfootball-lineup-assistant
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: SLEEPER_USERNAME
        value: CousinsFF
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_ACCESS_USERNAME
        value: Alexa
      - key: APP_ACCESS_PASSWORD
        sync: false
